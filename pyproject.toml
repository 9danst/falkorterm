[project]
name = "falkorterm"
version = "0.1.0"
description = "Cliente TUI de FalkorDB (Textual)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "falkordb>=1.0.0",
    "textual[syntax]>=8.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "textual-dev>=1.8.0",
]

[project.scripts]
falkorterm = "falkorterm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falkorterm"]

[tool.hatch.build.targets.wheel.force-include]
"src/falkorterm/cheatsheet/cypher_falkordb.md" = "falkorterm/cheatsheet/cypher_falkordb.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
