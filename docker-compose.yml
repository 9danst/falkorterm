services:
  falkordb:
    build: .
    image: falkorterm-db:local
    container_name: falkorterm-falkordb
    ports:
      - "${FALKOR_PORT:-6379}:6379"
      - "${FALKOR_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  falkordb_data:
